<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #150f08; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: #f8f5ef;
      font-family: 'Inter', Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 82%, rgba(227, 165, 48, 0.14), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(180, 110, 30, 0.10), transparent 24%),
        linear-gradient(180deg, #1a130a 0%, #150f08 55%, #100b06 100%);
    }

    .grain, .vignette { position: absolute; inset: 0; pointer-events: none; }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.28) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette { box-shadow: inset 0 -180px 220px rgba(0, 0, 0, 0.28), inset 0 0 140px rgba(0,0,0,0.14); }

    .ghost-quote {
      position: absolute;
      top: -70px;
      right: 20px;
      z-index: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 680px;
      font-weight: 900;
      color: rgba(227, 165, 48, 0.08);
      line-height: 1;
      pointer-events: none;
    }

    .top-bar {
      position: relative; z-index: 2;
      padding: 74px 90px 0;
      display: flex; justify-content: space-between; align-items: center;
    }

    .topic-tag {
      display: inline-flex; align-items: center;
      padding: 12px 22px; border-radius: 999px;
      background: rgba(227, 165, 48, 0.12);
      font-size: 18px; font-weight: 700; color: #e3a530;
      letter-spacing: 2px; text-transform: uppercase;
    }

    .watermark { font-size: 20px; color: rgba(248,245,239,0.7); font-weight: 500; }

    .main-content {
      position: relative; z-index: 2;
      padding: 0 90px;
      margin-top: 320px;
    }

    .eyebrow {
      font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(227, 165, 48, 0.85); margin-bottom: 24px;
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 74px;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -1.5px;
      max-width: 860px;
      text-wrap: pretty;
    }

    .subtitle {
      font-size: 28px;
      font-weight: 400;
      color: rgba(248,245,239,0.66);
      margin-top: 34px;
      line-height: 1.5;
      max-width: 740px;
    }

    .bottom-line {
      position: absolute;
      bottom: 90px; left: 90px; right: 90px;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 28px;
    }

    .swipe-hint { font-size: 22px; color: rgba(248,245,239,0.52); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="ghost-quote">&#8220;</div>
    <div class="top-bar">
      <span class="topic-tag">{{TAG}}</span>
      <span class="watermark">{{ACCOUNT_WATERMARK}}</span>
    </div>
    <div class="main-content">
      <div class="eyebrow">{{HOOK}}</div>
      <div class="title">{{TITLE}}</div>
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>
    <div class="bottom-line"><span class="swipe-hint">Swipe to read -&gt;</span></div>
  </div>
</body>
</html>
