<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1080px; height: 1350px;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0c;
            color: #f5f5f3;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .slide-container {
            width: 100%; height: 100%;
            padding: 90px 100px;
            display: flex; flex-direction: column;
            position: relative;
            background:
                radial-gradient(circle at 15% 90%, rgba(57, 255, 106, 0.05) 0%, rgba(11,11,12,0) 45%),
                linear-gradient(180deg, #0f0f10 0%, #0b0b0c 100%);
        }

        .center-stage {
            flex: 1; display: flex; flex-direction: column;
        }
        .center-stage .spacer-top { flex: 0.8; }
        .center-stage .spacer-bottom { flex: 1.2; }

        .grain {
            position: absolute; inset: 0; z-index: 0; opacity: 0.5; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
        }

        .progress-ring {
            position: absolute; top: 90px; right: 100px; z-index: 1;
            width: 64px; height: 64px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .progress-ring::after {
            content: ''; width: 50px; height: 50px; border-radius: 50%; background: #0b0b0c;
        }
        .ring-01 { background: conic-gradient(#39ff6a 0deg 72deg, rgba(255,255,255,0.14) 72deg 360deg); }
        .ring-02 { background: conic-gradient(#39ff6a 0deg 144deg, rgba(255,255,255,0.14) 144deg 360deg); }
        .ring-03 { background: conic-gradient(#39ff6a 0deg 216deg, rgba(255,255,255,0.14) 216deg 360deg); }
        .ring-04 { background: conic-gradient(#39ff6a 0deg 288deg, rgba(255,255,255,0.14) 288deg 360deg); }
        .ring-05 { background: conic-gradient(#39ff6a 0deg 360deg, rgba(255,255,255,0.14) 360deg 360deg); }

        .header { z-index: 1; }

        .title {
            font-family: 'Anton', sans-serif;
            font-size: 68px; font-weight: 400; line-height: 1.06; text-transform: uppercase;
            color: #f5f5f3; letter-spacing: 0.3px;
            margin-bottom: 44px;
        }

        .explanation {
            font-size: 30px; font-weight: 400; line-height: 1.55;
            color: #b7b7b2; max-width: 92%; text-align: justify;
        }

        .footer { z-index: 1; display: flex; justify-content: space-between; align-items: center; }

        .meta { display: flex; align-items: center; gap: 20px; }

        .watermark { font-size: 24px; font-weight: 500; color: #f5f5f3; }

        .pager {
            display: flex; align-items: center; gap: 12px;
            font-size: 24px; font-weight: 600; color: #39ff6a;
            text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grain"></div>
        <div class="progress-ring ring-{{STEP_NUM}}"></div>

        <div class="center-stage">
            <div class="spacer-top"></div>
            <div class="header">
                <h1 class="title">{{TITLE}}</h1>
                <p class="explanation">{{EXPLANATION}}</p>
            </div>
            <div class="spacer-bottom"></div>
        </div>

        <div class="footer">
            <div class="meta">
                <div class="watermark">{{ACCOUNT_WATERMARK}}</div>
            </div>
            <div class="pager">
                {{STEP_NUM}} / {{TOTAL}}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#39ff6a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
        </div>
    </div>
</body>
</html>
