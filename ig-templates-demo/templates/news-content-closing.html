<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet"><style>* { margin: 0; padding: 0; box-sizing: border-box; }body {  width: 1080px;  height: 1350px;  overflow: hidden;  background: #0b0f1a;}.slide {  position: relative;  width: 1080px;  height: 1350px;  overflow: hidden;  background: #0b0f1a;}/* Full-bleed background image */.bg-image {  position: absolute;  top: 0; left: 0;  width: 100%; height: 100%;  object-fit: cover;  object-position: center;}/* Full scrim — heavy dark overlay for readability */.scrim {  position: absolute;  inset: 0;  background: linear-gradient(    to bottom,    rgba(11,15,26,0.40) 0%,    rgba(11,15,26,0.65) 30%,    rgba(11,15,26,0.82) 55%,    rgba(11,15,26,0.93) 75%,    rgba(11,15,26,0.97) 88%,    rgba(11,15,26,1.00) 100%  );  z-index: 2;}/* Accent bar */.accent-bar {  position: absolute;  top: 0; left: 0;  width: 6px; height: 100%;  background: linear-gradient(to bottom, #00cfff 0%, #0057ff 100%);  z-index: 20;}/* Centered content */.content {  position: relative;  z-index: 10;  width: 100%;  height: 100%;  display: flex;  flex-direction: column;  align-items: center;  justify-content: center;  padding: 80px;}/* Avatar area */.avatar-area {  display: flex;  flex-direction: column;  align-items: center;  gap: 18px;  margin-bottom: 80px;}.avatar-wrap {  position: relative;  width: 112px;  height: 112px;}.avatar {  width: 112px;  height: 112px;  border-radius: 50%;  object-fit: cover;}.avatar-ring {  position: absolute;  top: 0; left: 0;  width: 112px; height: 112px;  border-radius: 50%;  border: 2px solid #00cfff;  pointer-events: none;}.handle {  font-family: 'Inter', sans-serif;  font-size: 26px;  color: rgba(255,255,255,0.70);  font-weight: 500;  letter-spacing: 0.2px;}/* CTA text block */.label {  font-family: 'Inter', sans-serif;  font-size: 17px;  font-weight: 600;  color: #00cfff;  letter-spacing: 4px;  text-transform: uppercase;  margin-bottom: 20px;}.headline {  font-family: 'Inter', sans-serif;  font-size: 80px;  font-weight: 900;  color: #ffffff;  letter-spacing: -2px;  line-height: 1.05;  text-align: center;  margin-bottom: 20px;}.sep {  width: 80px;  height: 3px;  background: #00cfff;  margin-bottom: 28px;}.sub {  font-family: 'Inter', sans-serif;  font-size: 28px;  color: rgba(255,255,255,0.55);  text-align: center;  line-height: 1.5;  margin-bottom: 20px;}.cta-hint {  font-family: 'Inter', sans-serif;  font-size: 20px;  color: rgba(255,255,255,0.30);  letter-spacing: 2px;  text-transform: uppercase;}</style></head><body><div class="slide">  <!-- Full-bleed background -->  <img class="bg-image" src="{{IMAGE_URL}}" />  <!-- Dark scrim overlay -->  <div class="scrim"></div>  <!-- Left accent bar -->  <div class="accent-bar"></div>  <!-- Centered content -->  <div class="content">    <div class="avatar-area">      <div class="avatar-wrap">        <img class="avatar" src="D:/Agent_workspace/ig-templates/renders/satrya/avatar.png" />        <div class="avatar-ring"></div>      </div>      <span class="handle">{{HANDLE}}</span>    </div>    <div class="label">Don't Miss Out</div>    <div class="headline">STAY<br>UPDATED</div>    <div class="sep"></div>    <div class="sub">Follow for daily insights<br>on AI, productivity &amp; tech.</div>    <div class="cta-hint">↑ Like &amp; Save this post</div>  </div></div></body></html>
