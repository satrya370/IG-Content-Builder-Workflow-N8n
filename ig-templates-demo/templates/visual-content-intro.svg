<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE: visual-content-intro | 1080×1350 | Clean dark visual intro -->
<!-- PLACEHOLDERS: TITLE_LINE1, TITLE_LINE2, ACCENT_LINE, SUBTITLE, IMAGE_3D_URL, TAG, AVATAR_URL, HANDLE -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <radialGradient id="visualIntroGlowA" cx="20%" cy="14%" r="28%">
      <stop offset="0%" stop-color="#366fab" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#366fab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="visualIntroGlowB" cx="82%" cy="12%" r="24%">
      <stop offset="0%" stop-color="#793dc1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#793dc1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visualIntroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="55%" stop-color="#09111c"/>
      <stop offset="100%" stop-color="#070d16"/>
    </linearGradient>
    <clipPath id="visualIntroAvatarClip"><circle cx="54" cy="50" r="22"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#visualIntroBg)"/>
  <rect width="1080" height="1350" fill="url(#visualIntroGlowA)"/>
  <rect width="1080" height="1350" fill="url(#visualIntroGlowB)"/>

  <image href="{{AVATAR_URL}}" x="32" y="28" width="44" height="44" clip-path="url(#visualIntroAvatarClip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="54" cy="50" r="22" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="88" y="57" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.72)">{{HANDLE}}</text>
  <text x="1048" y="57" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="rgba(255,255,255,0.38)" letter-spacing="2" text-anchor="end">{{TAG}}</text>

  <text x="68" y="260" font-family="Inter,Arial Black,sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">{{TITLE_LINE1}}</text>
  <text x="68" y="356" font-family="Inter,Arial Black,sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">{{TITLE_LINE2}}</text>
  <text x="68" y="430" font-family="Inter,Arial Black,sans-serif" font-size="40" font-weight="800" fill="#9b5cff" letter-spacing="-0.8">{{ACCENT_LINE}}</text>

  <rect x="88" y="546" width="904" height="520" rx="28" fill="rgba(17,23,35,0.88)"/>
  <rect x="88" y="546" width="904" height="520" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="106" y="564" width="868" height="484" rx="20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <image href="{{IMAGE_3D_URL}}" x="110" y="568" width="860" height="476" preserveAspectRatio="xMidYMid slice"/>

  <text x="540" y="1218" font-family="Inter,Arial,sans-serif" font-size="28" fill="rgba(255,255,255,0.58)" text-anchor="middle">{{SUBTITLE}}</text>

  <g transform="translate(490 1298)">
    <circle cx="0" cy="0" r="8" fill="#9b5cff"/>
    <circle cx="24" cy="0" r="5" fill="rgba(255,255,255,0.22)"/>
    <circle cx="44" cy="0" r="5" fill="rgba(255,255,255,0.22)"/>
    <circle cx="64" cy="0" r="5" fill="rgba(255,255,255,0.22)"/>
    <circle cx="84" cy="0" r="5" fill="rgba(255,255,255,0.22)"/>
    <circle cx="104" cy="0" r="5" fill="rgba(255,255,255,0.22)"/>
  </g>
</svg>
