<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #150f08; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: #f8f5ef;
      font-family: 'Inter', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 14% 82%, rgba(227, 165, 48, 0.12), transparent 26%),
        radial-gradient(circle at 86% 18%, rgba(180, 110, 30, 0.10), transparent 24%),
        linear-gradient(180deg, #1a130a 0%, #150f08 50%, #100b06 100%);
    }

    .grain, .vignette { position: absolute; inset: 0; pointer-events: none; }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.3) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette { box-shadow: inset 0 -180px 220px rgba(0,0,0,0.26), inset 0 0 120px rgba(0,0,0,0.12); }

    .step-indicator {
      position: relative; z-index: 2;
      padding: 64px 92px 0;
      font-family: 'Playfair Display', Georgia, serif;
      color: rgba(227, 165, 48, 0.75);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .center-stage {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 92px;
    }

    .quote-block {
      display: flex;
      align-items: flex-start;
      gap: 22px;
    }

    .quote-mark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 120px;
      font-weight: 900;
      color: #e3a530;
      line-height: 0.7;
      flex: 0 0 auto;
      margin-top: 12px;
    }

    .quote-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 54px;
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: -0.6px;
      color: #f8f5ef;
      text-wrap: pretty;
    }

    .divider {
      width: 64px;
      height: 3px;
      background: rgba(227, 165, 48, 0.5);
      border-radius: 999px;
      margin: 34px 0 26px 142px;
    }

    .support {
      font-size: 26px;
      line-height: 1.55;
      color: rgba(248,245,239,0.68);
      max-width: 780px;
      margin-left: 142px;
      text-wrap: pretty;
    }

    .source {
      display: inline-flex;
      align-self: flex-start;
      margin: 30px 0 0 142px;
      padding: 13px 24px;
      border-radius: 999px;
      background: rgba(227, 165, 48, 0.12);
      color: #e3a530;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .footer {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 92px 58px;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 0 92px;
    }

    .watermark { color: rgba(248,245,239,0.7); font-size: 22px; font-weight: 500; }
    .pager { display: flex; gap: 11px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .pagination-01 .dot:nth-child(2), .pagination-02 .dot:nth-child(3), .pagination-03 .dot:nth-child(4),
    .pagination-04 .dot:nth-child(5), .pagination-05 .dot:nth-child(6) { background: #e3a530; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="step-indicator">{{STEP_NUM}} / {{TOTAL}}</div>
    <div class="center-stage">
      <div class="quote-block">
        <div class="quote-mark">&#8220;</div>
        <div class="quote-text">{{QUOTE}}</div>
      </div>
      <div class="divider"></div>
      <div class="support">{{SUPPORT}}</div>
      <div class="source">{{SOURCE}}</div>
    </div>
    <div class="footer">
      <div class="watermark">{{ACCOUNT_WATERMARK}}</div>
      <div class="pager pagination-{{STEP_NUM}}">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>
</body>
</html>
