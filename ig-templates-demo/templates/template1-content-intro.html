<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
    body { background: #ececec; font-family: Arial, Helvetica, sans-serif; }
    .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; color: #2b292d; }
    .topbar { position: absolute; top: 11.2%; right: 11%; left: 11.1%; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
    .brand { display: flex; align-items: center; gap: 1.2cqw; }
    .brand-mark { position: relative; width: 3.15cqw; height: 3.15cqw; flex: 0 0 3.15cqw; border-radius: 50%; background: #ff4c55; }
    .eye { position: absolute; top: .93cqw; width: .46cqw; height: .46cqw; border-radius: 50%; background: #fff; }
    .eye-left { left: .74cqw; }
    .eye-right { right: .74cqw; }
    .smile { position: absolute; left: .74cqw; bottom: .74cqw; width: 1.67cqw; height: .83cqw; border-bottom: .37cqw solid #fff; border-radius: 0 0 1.67cqw 1.67cqw; }
    .brand-name { font-size: 3.7cqw; font-weight: 800; letter-spacing: -.13cqw; line-height: 1; }
    .account-label { margin-top: .37cqw; font-size: 2.69cqw; font-weight: 400; letter-spacing: .49cqw; white-space: nowrap; }
    .content { position: absolute; top: 29.8%; left: 11%; width: 76.9%; z-index: 2; }
    .eyebrow { margin: 0 0 3.24cqw; color: #727174; font-size: 2.78cqw; font-weight: 400; letter-spacing: .2cqw; text-transform: uppercase; }
    h1 { margin: 0; font-size: 8.24cqw; font-weight: 800; line-height: .99; letter-spacing: -.41cqw; }
    .slide-count { margin: 1.94cqw 0 0; color: #727174; font-size: 2.78cqw; line-height: 1; }
    .hashtag { position: absolute; left: 11%; bottom: 11%; z-index: 2; margin: 0; color: #727174; font-size: 2.87cqw; letter-spacing: .02cqw; }
    .accent-pattern { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .accent-pattern i { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); border-radius: 52% 48% 46% 54% / 68% 66% 34% 32%; background: #ff4c55; transform: rotate(var(--r)); }
  </style>
</head>

  <div class="slide">
    <header class="topbar">

        <span class="brand-mark" aria-hidden="true"><span class="eye eye-left"></span><span class="eye eye-right"></span><span class="smile"></span></span>
        <span class="brand-name">youami</span>

      <div class="account-label">{{ACCOUNT_WATERMARK}}</div>

</body>
</html>
