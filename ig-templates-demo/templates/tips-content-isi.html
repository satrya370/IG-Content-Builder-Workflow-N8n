<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #09111d; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      padding: 90px;
      background:
        radial-gradient(circle at 20% 14%, rgba(54, 111, 171, 0.12), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(121, 61, 193, 0.12), transparent 24%),
        radial-gradient(circle at 75% 75%, rgba(11, 151, 176, 0.08), transparent 26%),
        linear-gradient(180deg, #0b1320 0%, #09111c 55%, #070d16 100%);
      display: flex;
      flex-direction: column;
      font-family: 'Inter', Arial, sans-serif;
    }

    .grain,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.28) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette {
      box-shadow: inset 0 -180px 220px rgba(0, 0, 0, 0.24), inset 0 0 140px rgba(0,0,0,0.12);
    }

    .content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 70px;
      padding-bottom: 80px;
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 56px;
      font-weight: 700;
      color: #f6f8fd;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 14px;
      max-width: 880px;
    }

    .separator {
      width: 84px;
      height: 4px;
      background: #49a4ff;
      border-radius: 999px;
      margin-bottom: 18px;
      box-shadow: 0 0 18px rgba(73, 164, 255, 0.2);
    }

    .explanation {
      font-size: 28px;
      color: rgba(255,255,255,0.7);
      line-height: 1.58;
      font-weight: 400;
      max-width: 860px;
      text-align: justify;
    }

    .bottom-bar {
      position: absolute;
      bottom: 90px;
      left: 90px;
      right: 90px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 28px;
    }

    .watermark {
      font-size: 22px;
      color: rgba(255,255,255,0.72);
      font-weight: 500;
    }

  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="title">{{SUBTITLE}}</div>
      <div class="separator"></div>
      <div class="explanation">{{EXPLANATION}}</div>
    </div>

    <div class="bottom-bar">
      <span class="watermark">{{ACCOUNT_WATERMARK}}</span>
    </div>
  </div>
</body>
</html>
