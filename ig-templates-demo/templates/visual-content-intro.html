<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #09111d; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 14%, rgba(54, 111, 171, 0.12), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(121, 61, 193, 0.12), transparent 24%),
        radial-gradient(circle at 75% 75%, rgba(11, 151, 176, 0.08), transparent 26%),
        linear-gradient(180deg, #0b1320 0%, #09111c 55%, #070d16 100%);
      font-family: 'Inter', Arial, sans-serif;
    }

    .grain,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.28) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette {
      box-shadow: inset 0 -180px 220px rgba(0, 0, 0, 0.24), inset 0 0 140px rgba(0,0,0,0.12);
    }

    .top-bar {
      position: absolute;
      top: 28px;
      left: 32px;
      right: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 3;
    }

    .watermark {
      font-size: 22px;
      color: rgba(255,255,255,0.72);
      font-weight: 500;
    }

    .tag {
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.38);
      letter-spacing: 2px;
    }

    .title-block {
      position: absolute;
       top: 142px;
      left: 60px;
      right: 60px;
      z-index: 3;
    }

    .title-text {
       font-size: 76px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.04;
      letter-spacing: -1.8px;
      text-align: left;
      text-wrap: wrap;
    }

    .accent-line {
      display: block;
       font-size: 32px;
      font-weight: 700;
      color: #9b5cff;
      letter-spacing: -0.3px;
       margin-top: 12px;
    }

    .intro-copy {
      position: absolute;
      left: 60px;
      right: 60px;
      bottom: 116px;
      z-index: 3;
    }

    .visual-frame {
      position: absolute;
      left: 60px;
      right: 60px;
       top: 510px;
      height: 520px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(17, 23, 35, 0.88) 0%, rgba(12, 18, 29, 0.94) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 30px 70px rgba(0,0,0,0.28);
      overflow: hidden;
      z-index: 1;
    }

    .visual-frame::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      pointer-events: none;
    }

    .image-3d {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 22px;
      height: calc(100% - 44px);
      width: calc(100% - 44px);
      object-fit: cover;
      object-position: center center;
      border-radius: 18px;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.28));
      z-index: 2;
    }

    .subtitle {
      position: static;
       font-size: 23px;
      color: rgba(255,255,255,0.58);
      text-align: left;
       line-height: 1.42;
      max-width: 860px;
    }

    .slide-dots {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 3;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
    }

    .dot.active {
      width: 16px;
      height: 16px;
      background: #9b5cff;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="top-bar">
      <div class="watermark">{{ACCOUNT_WATERMARK}}</div>
      <div class="tag">{{TAG}}</div>
    </div>

    <div class="title-block">
      <div class="title-text">{{TITLE_LINE1}} {{TITLE_LINE2}}</div>
      <span class="accent-line">{{ACCENT_LINE}}</span>
    </div>

    <div class="visual-frame">
      <img class="image-3d" src="{{IMAGE_3D_URL}}" alt="3d visual">
    </div>

    <div class="intro-copy">
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>

    <div class="slide-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
