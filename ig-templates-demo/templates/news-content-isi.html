<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet"><style>* { margin: 0; padding: 0; box-sizing: border-box; }body {  width: 1080px;  height: 1350px;  overflow: hidden;  background: #0b0f1a;}.slide {  position: relative;  width: 1080px;  height: 1350px;  overflow: hidden;  background: #0b0f1a;}/* Background image — top 490px */.bg-image {  position: absolute;  top: 0; left: 0;  width: 100%; height: 490px;  object-fit: cover;  object-position: center;}/* Gradient scrim — blends image into dark background */.gradient-scrim {  position: absolute;  top: 270px; left: 0;  width: 100%; height: 220px;  background: linear-gradient(    to bottom,    rgba(11,15,26,0) 0%,    rgba(11,15,26,0.70) 50%,    rgba(11,15,26,1.00) 100%  );  z-index: 2;}/* Accent bar */.accent-bar {  position: absolute;  top: 0; left: 0;  width: 6px; height: 100%;  background: linear-gradient(to bottom, #00cfff 0%, #0057ff 100%);  z-index: 20;}/* Ghost step number — large faint number in background */.ghost-num {  position: absolute;  right: 86px;  top: 420px;  font-family: 'Inter', sans-serif;  font-size: 200px;  font-weight: 900;  color: rgba(0,207,255,0.05);  letter-spacing: -8px;  line-height: 1;  z-index: 3;  user-select: none;}/* Step row: TAG left, step count right */.step-row {  position: absolute;  top: 524px;  left: 86px;  right: 86px;  z-index: 10;  display: flex;  align-items: center;  justify-content: space-between;}.tag-label {  font-family: 'Inter', sans-serif;  font-size: 17px;  font-weight: 600;  color: #00cfff;  letter-spacing: 3px;  text-transform: uppercase;}.step-count {  font-family: 'Inter', sans-serif;  font-size: 17px;  font-weight: 400;  color: rgba(255,255,255,0.20);  letter-spacing: 1px;}/* Headline */.headline {  position: absolute;  top: 592px;  left: 86px;  right: 86px;  z-index: 10;  font-family: 'Inter', sans-serif;  font-size: 64px;  font-weight: 800;  color: #ffffff;  line-height: 1.12;  letter-spacing: -1.5px;}/* Separator line */.separator {  position: absolute;  top: 836px;  left: 86px;  width: 48px;  height: 3px;  background: #00cfff;  z-index: 10;}/* Explanation text */.explanation {  position: absolute;  top: 870px;  left: 86px;  right: 86px;  z-index: 10;  font-family: 'Inter', sans-serif;  font-size: 28px;  color: rgba(255,255,255,0.50);  line-height: 1.55;  font-weight: 400;  text-align: justify;}/* Bottom row */.bottom-row {  position: absolute;  bottom: 48px;  left: 86px;  right: 86px;  z-index: 10;  display: flex;  align-items: center;  justify-content: space-between;}.avatar-group {  display: flex;  align-items: center;  gap: 16px;}.avatar-wrap {  position: relative;  width: 56px;  height: 56px;  flex-shrink: 0;}.avatar {  width: 56px;  height: 56px;  border-radius: 50%;  object-fit: cover;}.avatar-ring {  position: absolute;  top: 0; left: 0;  width: 56px; height: 56px;  border-radius: 50%;  border: 1.5px solid rgba(0,207,255,0.50);  pointer-events: none;}.handle {  font-family: 'Inter', sans-serif;  font-size: 20px;  color: rgba(255,255,255,0.35);  font-weight: 400;  white-space: nowrap;}.step-indicator {  font-family: 'Inter', sans-serif;  font-size: 18px;  font-weight: 700;  color: rgba(255,255,255,0.15);  letter-spacing: 2px;}</style></head><body><div class="slide">  <!-- Background image -->  <img class="bg-image" src="{{IMAGE_URL}}" />  <!-- Gradient scrim -->  <div class="gradient-scrim"></div>  <!-- Left accent bar -->  <div class="accent-bar"></div>  <!-- Ghost step number -->  <div class="ghost-num">{{STEP_NUM}}</div>  <!-- Step row: TAG | count -->  <div class="step-row">    <span class="tag-label">{{TAG}}</span>    <span class="step-count">{{STEP_NUM}} / {{TOTAL}}</span>  </div>  <!-- Headline -->  <div class="headline">{{TITLE}}</div>  <!-- Separator -->  <div class="separator"></div>  <!-- Explanation -->  <div class="explanation">{{EXPLANATION}}</div>  <!-- Bottom row -->  <div class="bottom-row">    <div class="avatar-group">      <div class="avatar-wrap">        <img class="avatar" src="D:/Agent_workspace/ig-templates/renders/satrya/avatar.png" />        <div class="avatar-ring"></div>      </div>      <span class="handle">{{HANDLE}}</span>    </div>    <span class="step-indicator">{{STEP_NUM}} — {{TOTAL}}</span>  </div></div></body></html>
