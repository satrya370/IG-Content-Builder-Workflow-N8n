<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE: visual-content-isi | 1080×1350 | Dark + warm bokeh, purple #a855f7 -->
<!-- PLACEHOLDERS: STEP_NUM, TITLE, EXPLANATION_L1, EXPLANATION_L2, IMAGE_URL, TOTAL, AVATAR_URL, HANDLE -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <radialGradient id="visual-isi-bgGlow" cx="78%" cy="18%" r="52%">
      <stop offset="0%"   stop-color="#2a1600" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#180e00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="visual-isi-imgClip">
      <rect x="110" y="546" width="860" height="542" rx="16" ry="16"/>
    </clipPath>
    <clipPath id="visual-isi-avatarClip">
      <circle cx="121" cy="1283" r="31"/>
    </clipPath>
  </defs>

  <g id="visual-isi-BG">
    <rect x="0" y="0" width="1080" height="1350" fill="#09111d"/>
    <rect x="0" y="0" width="1080" height="1350" fill="url(#visual-isi-bgGlow)"/>
  </g>

  <text id="visual-isi-StepNum"
        x="1050" y="260"
        font-family="Inter,Arial Black,sans-serif"
        font-size="220" font-weight="900" fill="rgba(255,255,255,0.05)"
        letter-spacing="-10" text-anchor="end">{{STEP_NUM}}</text>

  <g id="visual-isi-Content">
    <text id="visual-isi-Title"
          x="110" y="186"
          font-family="Inter,Arial Black,sans-serif"
          font-size="58" font-weight="900" fill="#ffffff"
          letter-spacing="-1.5">{{TITLE}}</text>

    <rect id="visual-isi-TitleAccent"
          x="110" y="200" width="62" height="4" fill="#9b5cff"/>

    <text id="visual-isi-ExplanationL1"
          x="110" y="254"
          font-family="Inter,Arial,sans-serif"
          font-size="20" fill="rgba(255,255,255,0.72)">{{EXPLANATION_L1}}</text>

    <text id="visual-isi-ExplanationL2"
          x="110" y="348"
          font-family="Inter,Arial,sans-serif"
          font-size="20" fill="rgba(255,255,255,0.72)">{{EXPLANATION_L2}}</text>
  </g>

  <g id="visual-isi-ImageContainer">
    <rect x="88" y="524" width="904" height="586" rx="24" fill="rgba(17,23,35,0.88)"/>
    <rect x="88" y="524" width="904" height="586" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="106" y="542" width="868" height="550" rx="18" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <image id="visual-isi-Image"
         href="{{IMAGE_URL}}"
         x="110" y="546" width="860" height="542"
         clip-path="url(#visual-isi-imgClip)"
         preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g id="visual-isi-BottomBar">
      <line x1="88" y1="1266" x2="992" y2="1266" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g id="visual-isi-AvatarGroup">
      <image id="visual-isi-Avatar"
             href="{{AVATAR_URL}}"
             x="88" y="1250" width="44" height="44"
             clip-path="url(#visual-isi-avatarClip)"
             preserveAspectRatio="xMidYMid slice"/>
      <circle cx="110" cy="1272" r="22" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    </g>

    <text id="visual-isi-Handle"
          x="146" y="1280"
          font-family="Inter,Arial,sans-serif"
          font-size="22" font-weight="500" fill="rgba(255,255,255,0.72)">{{HANDLE}}</text>

    <text id="visual-isi-Indicator"
          x="992" y="1280"
          font-family="Inter,Arial,sans-serif"
          font-size="22" font-weight="600" fill="#8a58ff" text-anchor="end">{{STEP_NUM}} / {{TOTAL}}</text>
  </g>
</svg>
