<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1080px; height: 1350px;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0c;
            color: #f5f5f3;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .slide-container {
            width: 100%; height: 100%;
            padding: 100px;
            display: flex; flex-direction: column; justify-content: center;
            position: relative;
            background:
                radial-gradient(circle at 85% 12%, rgba(57, 255, 106, 0.07) 0%, rgba(11,11,12,0) 45%),
                linear-gradient(180deg, #0f0f10 0%, #0b0b0c 100%);
        }

        .grain {
            position: absolute; inset: 0; z-index: 0; opacity: 0.5; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
        }

        .progress-ring {
            position: absolute; top: 90px; right: 100px; z-index: 1;
            width: 64px; height: 64px; border-radius: 50%;
            background: conic-gradient(#39ff6a 0deg 360deg);
            display: flex; align-items: center; justify-content: center;
        }
        .progress-ring::after {
            content: ''; width: 50px; height: 50px; border-radius: 50%; background: #0b0b0c;
            display: flex; align-items: center; justify-content: center;
        }
        .progress-ring .check {
            position: absolute;
        }

        .center-stage { z-index: 1; }

        .kicker {
            font-size: 26px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
            color: #39ff6a; margin-bottom: 26px;
        }

        .title {
            font-family: 'Anton', sans-serif;
            font-size: 76px; font-weight: 400; line-height: 1.06; text-transform: uppercase;
            color: #f5f5f3; margin-bottom: 30px;
        }

        .accent-word {
            font-family: 'Caveat', cursive;
            font-size: 80px; font-weight: 700; line-height: 1;
            color: #39ff6a; margin-bottom: 46px;
        }

        .subtext {
            font-size: 28px; font-weight: 400; line-height: 1.55;
            color: #b7b7b2; max-width: 82%;
        }

        .footer {
            z-index: 1; position: absolute; left: 100px; right: 100px; bottom: 90px;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1.5px solid rgba(255,255,255,0.1); padding-top: 30px;
        }

        .meta { display: flex; align-items: center; gap: 20px; }

        .watermark { font-size: 24px; font-weight: 500; color: #f5f5f3; }

        .pagination {
            font-size: 24px; font-weight: 600; color: #9a9a94;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grain"></div>
        <div class="progress-ring"></div>

        <div class="center-stage">
            <div class="kicker">That's a wrap</div>
            <h1 class="title">Save it.<br>Try it.<br>Repeat.</h1>
            <div class="accent-word">Follow for more</div>
            <p class="subtext">New ideas like this, every week — right in your feed.</p>
        </div>

        <div class="footer">
            <div class="meta">
                <div class="watermark">{{ACCOUNT_WATERMARK}}</div>
            </div>
            <div class="pagination">7/7</div>
        </div>
    </div>
</body>
</html>
