<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #150f08; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      padding: 90px;
      background:
        radial-gradient(circle at 20% 14%, rgba(227, 165, 48, 0.12), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(180, 110, 30, 0.10), transparent 24%),
        radial-gradient(circle at 75% 75%, rgba(120, 80, 30, 0.08), transparent 26%),
        linear-gradient(180deg, #1a130a 0%, #150f08 55%, #100b06 100%);
      font-family: 'Inter', Arial, sans-serif;
    }

    .grain, .vignette { position: absolute; inset: 0; pointer-events: none; }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.28) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette { box-shadow: inset 0 -180px 220px rgba(0, 0, 0, 0.26), inset 0 0 140px rgba(0,0,0,0.12); }

    .content { position: relative; margin-top: 270px; z-index: 2; }

    .hook {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 160px; font-weight: 900; color: #f8f5ef;
      line-height: 0.88; letter-spacing: -5px; margin-bottom: 28px;
    }

    .accent-bar {
      width: 120px; height: 6px; background: #e3a530; border-radius: 999px;
      margin-bottom: 52px; box-shadow: 0 0 18px rgba(227, 165, 48, 0.24);
    }

    .sub1 { font-size: 34px; color: rgba(248,245,239,0.74); margin-bottom: 16px; font-weight: 400; }
    .sub2 { font-size: 30px; color: rgba(248,245,239,0.56); font-weight: 400; }

    .account-block {
      position: absolute; bottom: 200px; left: 0; right: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }

    .account-label { font-size: 28px; font-weight: 600; color: #f8f5ef; }
    .follow-label { font-size: 22px; color: #e3a530; letter-spacing: 2px; font-weight: 700; }

    .bottom-line {
      position: absolute; bottom: 90px; left: 90px; right: 90px; z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: 28px; text-align: center;
    }

    .bottom-tag { font-size: 20px; color: rgba(248,245,239,0.48); letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="content">
      <div class="hook">FOLLOW.</div>
      <div class="accent-bar"></div>
      <div class="sub1">Like &amp; save if this was helpful.</div>
      <div class="sub2">More sharp insights every week.</div>
    </div>
    <div class="account-block">
      <span class="account-label">{{ACCOUNT_WATERMARK}}</span>
      <span class="follow-label">{{FOLLOW_CTA}}</span>
    </div>
    <div class="bottom-line"><span class="bottom-tag">Fresh Insights Every Week</span></div>
  </div>
</body>
</html>
