<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #09111d; }
    .slide {
      position: relative; width: 1080px; height: 1350px; overflow: hidden;
      background:
        radial-gradient(circle at 20% 14%, rgba(54, 111, 171, 0.12), transparent 28%),
        radial-gradient(circle at 84% 14%, rgba(121, 61, 193, 0.12), transparent 24%),
        radial-gradient(circle at 74% 78%, rgba(11, 151, 176, 0.07), transparent 26%),
        linear-gradient(180deg, #0b1320 0%, #09111c 55%, #070d16 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #ffffff;
    }
    .content {
      position: absolute; inset: 0; padding: 120px 88px 96px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: rgba(155,92,255,0.9); margin-bottom: 28px; text-transform: uppercase; }
    .hook { max-width: 860px; font-size: 108px; font-weight: 900; line-height: 0.95; letter-spacing: -4px; margin-bottom: 26px; }
    .accent-bar { width: 150px; height: 6px; background: #9b5cff; margin-bottom: 34px; border-radius: 999px; }
    .sub1 { max-width: 760px; font-size: 32px; line-height: 1.45; color: rgba(255,255,255,0.62); margin-bottom: 14px; }
    .sub2 { max-width: 760px; font-size: 28px; line-height: 1.45; color: rgba(155,92,255,0.88); margin-bottom: 56px; }
    .account-label { font-size: 30px; color: rgba(255,255,255,0.82); font-weight: 700; margin-bottom: 16px; }
    .follow-label { font-size: 22px; color: #9b5cff; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="content">
      <div class="eyebrow">Save This Workflow</div>
      <div class="hook">FOLLOW.</div>
      <div class="accent-bar"></div>
      <div class="sub1">Like and save this if you want more GitHub repos, Claude Code workflows, and practical AI engineering breakdowns.</div>
      <div class="sub2">The right repo can change how your coding agent thinks, not just what it types.</div>
       <div class="account-label">{{ACCOUNT_WATERMARK}}</div>
       <div class="follow-label">{{FOLLOW_CTA}}</div>
    </div>
  </div>
</body>
</html>
