<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #09111d; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 14%, rgba(54, 111, 171, 0.12), transparent 28%),
        radial-gradient(circle at 84% 14%, rgba(121, 61, 193, 0.12), transparent 24%),
        radial-gradient(circle at 74% 78%, rgba(11, 151, 176, 0.07), transparent 26%),
        linear-gradient(180deg, #0b1320 0%, #09111c 55%, #070d16 100%);
      font-family: 'Inter', Arial, sans-serif;
    }

    .grain,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 0.6px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.28) 0.6px, transparent 0.6px);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
    }

    .vignette {
      box-shadow: inset 0 -180px 220px rgba(0,0,0,0.22), inset 0 0 140px rgba(0,0,0,0.12);
    }

    .ghost-num {
      position: absolute;
      right: 30px;
      top: 48px;
      font-size: 220px;
      font-weight: 900;
      color: rgba(255,255,255,0.05);
      line-height: 1;
      letter-spacing: -10px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      padding: 96px 96px 0;
      z-index: 3;
    }

    .title {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.2px;
      line-height: 1.12;
      margin-bottom: 12px;
    }

    .title-accent {
      width: 62px;
      height: 4px;
      background: #9b5cff;
      margin-bottom: 20px;
    }

    .copy {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .copy p {
       font-size: 22px;
      color: rgba(255,255,255,0.72);
       line-height: 1.48;
    }

    .image-shell {
      position: absolute;
      top: 500px;
      left: 96px;
      right: 96px;
      height: 540px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(17, 23, 35, 0.88) 0%, rgba(12, 18, 29, 0.94) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 30px 70px rgba(0,0,0,0.26);
      overflow: hidden;
      z-index: 2;
    }

    .image-shell::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.04);
      pointer-events: none;
    }

    .image-shell img {
      position: absolute;
      inset: 22px;
      width: calc(100% - 44px);
      height: calc(100% - 44px);
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .bottom-bar {
      position: absolute;
      bottom: 50px;
      left: 96px;
      right: 96px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 3;
    }

    .watermark {
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
    }

    .indicator {
      font-size: 22px;
      color: #8a58ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="ghost-num">{{STEP_NUM}}</div>

    <div class="content">
      <div class="title">{{TITLE}}</div>
      <div class="title-accent"></div>
      <div class="copy">
        <p>{{EXPLANATION_L1}}</p>
        <p>{{EXPLANATION_L2}}</p>
      </div>
    </div>

    <div class="image-shell">
      <img src="{{IMAGE_URL}}" alt="visual">
    </div>

    <div class="bottom-bar">
      <div class="watermark">{{ACCOUNT_WATERMARK}}</div>
      <div class="indicator">{{STEP_NUM}} / {{TOTAL}}</div>
    </div>
  </div>
</body>
</html>
