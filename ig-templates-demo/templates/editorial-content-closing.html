<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1080px; height: 1350px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8F9FA;
            color: #1A1A1A;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .slide-container {
            width: 100%; height: 100%;
            padding: 100px;
            display: flex; flex-direction: column; justify-content: center;
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #F8F9FA 100%);
        }

        .bg-decoration {
            position: absolute; top: -150px; right: -150px; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: 0;
        }

        .bg-decoration-2 {
            position: absolute; bottom: -100px; left: -100px; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(33, 33, 33, 0.03) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: 0;
        }

        .eyebrow-row {
            z-index: 1; display: flex; align-items: center; gap: 20px;
            margin-bottom: 46px;
        }

        .icon-badge {
            width: 60px; height: 60px; flex-shrink: 0;
            border-radius: 50%;
            border: 1.6px solid #E6D6B3;
            display: flex; align-items: center; justify-content: center;
        }

        .subtitle {
            font-size: 24px; font-weight: 600; letter-spacing: 3.5px; text-transform: uppercase;
            color: #C9A227;
        }

        .title {
            z-index: 1;
            font-size: 64px; font-weight: 800; line-height: 1.12;
            color: #111111; margin-bottom: 56px;
            text-wrap: pretty;
        }

        .cta-box {
            z-index: 1;
            display: flex; flex-direction: column; gap: 32px;
            padding: 44px 0;
            border-top: 1.6px solid #EEEEEE;
            border-bottom: 1.6px solid #EEEEEE;
        }

        .cta-item { display: flex; align-items: center; gap: 22px; font-size: 30px; font-weight: 600; color: #222222; }

        .checklist-icon {
            width: 38px; height: 38px; flex-shrink: 0;
            background-color: #FBF3DF;
            border: 1.6px solid #E6D6B3;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .checklist-icon svg { width: 18px; height: 18px; }

        .footer { z-index: 1; margin-top: 56px; }

        .thank-you {
            font-size: 27px; font-weight: 500; font-style: italic; color: #888888;
            margin-bottom: 34px; text-align: center;
        }

        .meta { display: flex; justify-content: space-between; align-items: center; }

        .username { font-size: 28px; font-weight: 600; color: #111111; }

        .pagination {
            font-size: 26px; font-weight: 500; color: #888888;
            background-color: #EEEEEE; padding: 8px 20px; border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-decoration"></div>
        <div class="bg-decoration-2"></div>

        <div class="eyebrow-row">
            <div class="icon-badge">
                <svg width="26" height="26" viewBox="0 0 42 42" fill="none">
                    <path d="M13 8h11l6 6v18a2 2 0 01-2 2H13a2 2 0 01-2-2V10a2 2 0 012-2z" stroke="#C9A227" stroke-width="1.6"/>
                    <path d="M24 8v6h6" stroke="#C9A227" stroke-width="1.6"/>
                    <path d="M15 21h10M15 26h10M15 31h6" stroke="#C9A227" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="subtitle">Closing</div>
        </div>

        <h1 class="title">Save it. Share it.<br>Put it to use.</h1>

        <div class="cta-box">
            <div class="cta-item">
                <div class="checklist-icon">
                    <svg viewBox="0 0 24 24" fill="#C9A227"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                Save this for when you need it.
            </div>
            <div class="cta-item">
                <div class="checklist-icon">
                    <svg viewBox="0 0 24 24" fill="#C9A227"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                Share it with someone who needs it.
            </div>
            <div class="cta-item">
                <div class="checklist-icon">
                    <svg viewBox="0 0 24 24" fill="#C9A227"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                {{FOLLOW_CTA}}
            </div>
        </div>

        <div class="footer">
            <div class="thank-you">Thanks for reading.</div>
            <div class="meta">
                <div class="username">{{ACCOUNT_WATERMARK}}</div>
                <div class="pagination">7/7</div>
            </div>
        </div>
    </div>
</body>
</html>
